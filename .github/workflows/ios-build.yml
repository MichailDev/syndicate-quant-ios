name: Build SYNDICATE QUANT iOS v5.2.2 (Windows-only workflow)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: |
          set -euo pipefail
          xcodebuild -project ios/SyndicateQuant/SyndicateQuant.xcodeproj \
            -scheme SyndicateQuant -sdk iphoneos -configuration Release \
            -showBuildSettings > /tmp/build-settings.txt
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ios/SyndicateQuant/SyndicateQuant/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' ios/SyndicateQuant/SyndicateQuant/Info.plist

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/SyndicateQuant/SyndicateQuant.xcodeproj \
            -scheme SyndicateQuant \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_NAME=SyndicateQuant

      - name: Validate built app bundle
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SyndicateQuant.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          test -f "$APP/SyndicateQuant"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          test "$EXEC" = "SyndicateQuant"
          test "$BUNDLE" = "com.syndicatequant.app"
          test "$VERSION" = "5.2.2"
          test -x "$APP/$EXEC"
          echo "Executable: $EXEC"
          echo "Bundle ID: $BUNDLE"
          echo "Version: $VERSION"

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/SyndicateQuant.app"
          rm -rf ipa SYNDICATE_QUANT_iOS_UNSIGNED.ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          cd ipa
          zip -qry ../SYNDICATE_QUANT_iOS_UNSIGNED.ipa Payload
          cd ..
          unzip -l SYNDICATE_QUANT_iOS_UNSIGNED.ipa
          unzip -p SYNDICATE_QUANT_iOS_UNSIGNED.ipa Payload/SyndicateQuant.app/Info.plist > /tmp/ipa-info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' /tmp/ipa-info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' /tmp/ipa-info.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-quant-ios-v5.2.2-unsigned
          path: SYNDICATE_QUANT_iOS_UNSIGNED.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-quant-ios-v5.2.2-build-log
          path: /tmp/build-settings.txt
          if-no-files-found: warn
