name: Build SYNDICATE QUANT iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate project
        run: |
          set -o pipefail

          xcodebuild \
            -project ios/SyndicateQuant/SyndicateQuant.xcodeproj \
            -scheme SyndicateQuant \
            -sdk iphoneos \
            -configuration Release \
            -showBuildSettings \
            2>&1 | tee validate.log

      - name: Build unsigned app
        id: build
        continue-on-error: true
        run: |
          set -o pipefail

          rm -rf build

          xcodebuild \
            -project ios/SyndicateQuant/SyndicateQuant.xcodeproj \
            -scheme SyndicateQuant \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-quant-ios-diagnostics
          path: |
            build.log
            validate.log
          if-no-files-found: warn

      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "iOS build failed. See build.log artifact."
          exit 1

      - name: Package IPA
        run: |
          set -euo pipefail

          APP="build/Build/Products/Release-iphoneos/SyndicateQuant.app"

          test -d "$APP"

          rm -rf ipa
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/

          cd ipa
          zip -qry ../SYNDICATE_QUANT_iOS_UNSIGNED.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: syndicate-quant-ios-unsigned
          path: SYNDICATE_QUANT_iOS_UNSIGNED.ipa
          if-no-files-found: error
