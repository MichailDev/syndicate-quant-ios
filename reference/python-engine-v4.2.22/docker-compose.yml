services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "bot.main"]

  api:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    command: ["uvicorn", "server.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
